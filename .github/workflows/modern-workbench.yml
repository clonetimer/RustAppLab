name: Modern Rust workbench host teaching
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  host:
    name: Modern learner workbench / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.100.0
      - name: Build real workbench
        run: cargo build --locked --offline --release -p labquest
      - name: Install actual browser
        if: runner.os == 'Linux'
        run: |
          python -m pip install playwright==1.65.2
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Real host checks and actual browser edit/recovery
        if: runner.os == 'Linux'
        run: python scripts/modern_workbench_check.py --output modern-workbench-evidence --browser
      - name: Real host checks
        if: runner.os == 'Windows'
        run: python scripts/modern_workbench_check.py --output modern-workbench-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modern-workbench-${{ matrix.os }}
          path: modern-workbench-evidence/
