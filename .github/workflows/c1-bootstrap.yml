name: C1 rebuild bootstrap (feature only)
on:
  push:
    branches: [feat/async-network-c1-rebuild]
permissions:
  contents: read
jobs:
  lock-and-red:
    if: contains(github.event.head_commit.message, '[c1-bootstrap]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/async-network-c1-rebuild
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt
      - name: Generate real lock graph
        run: cargo generate-lockfile --manifest-path projects/advanced-c1/reference/Cargo.toml
      - name: Observe TODO assertions fail (not compiler failure)
        shell: bash
        run: |
          set +e
          cargo test --locked --manifest-path projects/advanced-c1/reference/Cargo.toml --test contracts > c1-red.txt 2>&1
          code=$?
          set -e
          cat c1-red.txt
          test "$code" = 101
          grep -q 'C1 TODO' c1-red.txt
          grep -q 'test result: FAILED' c1-red.txt
      - name: Persist generated lock on this feature only
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/advanced-c1/reference/Cargo.lock
          git commit -m 'build: persist Cargo 1.85 generated C1 lock'
          git push origin HEAD:refs/heads/feat/async-network-c1-rebuild
          git archive --format=zip --output=c1-source-snapshot.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c1-bootstrap-evidence
          path: |
            c1-red.txt
            c1-source-snapshot.zip
            projects/advanced-c1/reference/Cargo.lock
