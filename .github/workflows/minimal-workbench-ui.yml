name: Minimal workbench real browser comparison
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the actual workbench
        run: cargo build --locked --offline --release -p labquest
      - name: Install the tested browser and Chinese fonts
        run: |
          python -m pip install playwright==1.65.2
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Compare real desktop/mobile before and after
        run: python scripts/minimal_workbench_browser_check.py --output minimal-ui-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minimal-workbench-before-after
          path: minimal-ui-evidence/
