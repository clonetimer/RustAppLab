name: Modern Rust D10-A async core
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  d10a:
    name: D10-A Rust 1.100.0 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.100.0
      - name: Validate learner/source isolation
        run: python -m unittest discover -s scripts/tests -p test_modern_d10a_delivery.py -v
      - name: Run actual Future contracts and compiler diagnostic pairs
        run: python scripts/modern_d10a_check.py --output d10a-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modern-d10a-${{ matrix.os }}
          path: d10a-evidence/
