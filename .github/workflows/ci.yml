name: Rust AppLab Windows/Linux supported-platform CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  native:
    env:
      CARGO_HOME: ${{ github.workspace }}/.cargo-stable
    name: Native engineering / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: SQLite development library
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Rust error lessons must fail and be repaired as described
        run: python scripts/check_error_labs.py
      - name: Prepare fixed B4 registry graph (network explicitly allowed here)
        run: cargo fetch --locked --manifest-path projects/advanced-b/reference/json-export/Cargo.toml
      - name: Complete native Debug + Release + real product checks
        run: python scripts/release_check.py --output native-evidence
      - name: Windows launcher and evidence script itself
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/verify_release_windows.ps1 -OutputDirectory windows-launcher-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ matrix.os }}
          path: |
            native-evidence/
            windows-launcher-evidence/engineering.json
            windows-launcher-evidence/*.txt
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Workbench draft, project and result state regressions
        run: node --test scripts/tests/workbench_ui_state.cjs
      - run: cargo build --locked --offline --release -p localhub -p servicedesk -p labquest
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk
      - name: Actual browser navigation, HTTP, create/close, restart, mobile
        run: python scripts/browser_e2e.py --output browser-evidence
      - name: Embedded learning workbench, compiler feedback and before/after screenshots
        env:
          WORKBENCH_BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/workbench_browser_e2e.py --output browser-evidence/workbench
      - name: C2 real Axum browser workflow
        run: |
          cargo fetch --locked --manifest-path projects/advanced-c2/reference/Cargo.toml
          cargo build --locked --offline --manifest-path projects/advanced-c2/reference/Cargo.toml
          python scripts/c2_browser_e2e.py --exe projects/advanced-c2/reference/target/debug/servicedesk-c2 --output browser-evidence/c2-browser.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-browser
          path: browser-evidence/
  msrv:
    env:
      CARGO_HOME: ${{ github.workspace }}/.cargo-msrv-1.74
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.74.0
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare fixed B4 registry graph using actual Rust 1.74
        run: cargo fetch --locked --manifest-path projects/advanced-b/reference/json-export/Cargo.toml
      - name: Declared MSRV Debug, Release and docs
        run: python scripts/msrv_check.py --output msrv-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: declared-msrv
          path: msrv-evidence/
  book-practice:
    name: Book D/E practice / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy, rust-docs, rust-analyzer
      - name: Execute tools on an isolated copy and retain command evidence
        run: python scripts/book_d6_check.py --mode tools --toolchain 1.85.0 --output d6-practical-evidence/tools --keep-workspace
      - name: Execute Edition 2021 to 2024 migration and compare source snapshots
        run: python scripts/book_d6_check.py --mode edition --toolchain 1.85.0 --output d6-practical-evidence/edition --keep-workspace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: book-practice-${{ matrix.os }}
          path: d6-practical-evidence/
  c1:
    uses: ./.github/workflows/c1.yml
  c2:
    uses: ./.github/workflows/c2.yml
  delivery:
    uses: ./.github/workflows/delivery.yml
  candidate:
    name: Assemble verified candidate
    needs: [native, browser, msrv, c1, c2, delivery, book-practice]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select current-run artifacts and verify exact downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          selection_path="$RUNNER_TEMP/selected-artifacts.json"
          python scripts/select_ci_artifacts.py --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" > "$selection_path"
          python scripts/download_ci_artifacts.py --selection "$selection_path" --output collected-evidence
      - name: Verify reports, source identity and artifact hashes
        run: python scripts/assemble_candidate.py --input collected-evidence --output candidate-release
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-release
          path: candidate-release/
  checkpoint:
    name: Tag successful main checkpoint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [native, browser, msrv, c1, c2, delivery, book-practice, candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create immutable lightweight checkpoint (idempotent)
        run: python scripts/tag_checkpoint.py
  publish-candidate:
    name: Publish immutable RC assets
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [candidate, checkpoint]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: candidate-release
          path: candidate-release
      - name: Verify exact tag and create prerelease without replacing assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          [[ "$version" =~ ^0\.19\.0-rc\.[0-9]+$ ]]
          tag="v$version"
          remote=$(git ls-remote --tags origin "refs/tags/$tag" | cut -f1)
          if [[ -n "$remote" && "$remote" != "$GITHUB_SHA" ]]; then
            echo "Existing release tag points to another commit" >&2; exit 1
          fi
          if [[ -z "$remote" ]]; then
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi
          (cd candidate-release && sha256sum -c SHA256SUMS.txt)
          cat > candidate-notes.md <<'EOF'
          网页学习工作台候选版。FirstCard 与全部 12 款 Studio 在同一页阅读中文任务卡、编辑保存源码、运行程序并查看原检查器的真实结果。
          Windows 双击 START_WORKBENCH_WINDOWS.cmd，Linux 运行 ./START_WORKBENCH.sh；已有工程输入实际路径继续，不重新初始化。界面内置，无新增 Python、Node 或 WSL 前置。
          完整源码、17工程学员包、C1/C2离线源码包及Windows/Linux运行包经过同提交准入；浏览器证据包含四种尺寸的实际页面和前后对照。独立作品、进阶 A/B/C 与 Book 专题保持原入口。
          先阅读 QUICK_START.md 和 course/WORKBENCH.md；已编译工作台选择对应平台 runtime.zip，完整源码与课程选择 source.zip。
          此发布为RC，不是Stable。真实学习观察仍待填写USER_TRIAL.md，不能以自动测试代替。
          运行包打开工作台无需Cargo；运行或检查学员源码仍需Rust与系统工具链。StoreDesk需系统SQLite。Linux系统库要求见包内BUILD_INFO.json，Windows CI不等于用户本机Win10验收。
          版本、提交、来源指纹与所有文件校验见RELEASE_MANIFEST.json和SHA256SUMS.txt，原始证据见VERIFICATION_EVIDENCE.zip。
          EOF
          gh release create "$tag" candidate-release/* --verify-tag --draft --prerelease --latest=false --title "Rust AppLab $version — 网页学习工作台" --notes-file candidate-notes.md
          gh release edit "$tag" --draft=false --prerelease --latest=false
