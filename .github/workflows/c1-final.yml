name: C1 offline handoff correction objects
on:
  push:
    branches: [feat/async-network-c1-rebuild]
permissions:
  contents: read
jobs:
  objects:
    if: contains(github.event.head_commit.message, '[c1-handoff-objects]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Complete marker documentation and reproducible metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess,sys
          p=Path('scripts/package.py');s=p.read_text(encoding='utf-8');old='            item.compress_type = zipfile.ZIP_DEFLATED'
          assert old in s
          p.write_bytes(s.replace(old,'            item.create_system = 3\n'+old).encode('utf-8'))
          p=Path('course/ADVANCED_C1.md');s=p.read_text(encoding='utf-8');old='解压后在含 Cargo.toml 的目录运行'
          assert old in s
          p.write_bytes(s.replace(old,'学员包带有 `.applab-c1` 工程标记，可直接作为 LabQuest 的学员工程使用；不要在已解压的目录再次运行 start。参考包不带学员标记。\n\n'+old).encode('utf-8'))
          p=Path('docs/superpowers/plans/2026-11-03-c1-rebuild.md');s=p.read_text(encoding='utf-8')
          s+='\n- Final archive review caught a real integration omission: standalone learner ZIP lacked `.applab-c1`, so the fixed platform rejected it as an unregistered project. Added the learner-only marker and an actual portable fixed-assessment red→green replay under empty CARGO_HOME, using only the vendored dependencies. The completed reference code is copied only into the temporary extracted replay directory, never into the shipped learner ZIP.\n- Normalized ZIP member ordering and creator metadata so Windows/Linux packages can be compared byte-for-byte. Two new distribution tests first failed for the missing marker helper and host-dependent ZIP metadata; verification of the updated package awaits the new current-head CI.\n'
          p.write_bytes(s.encode('utf-8'))
          Path('.github/workflows/c1-final.yml').unlink()
          subprocess.run([sys.executable,'-m','unittest','discover','-s','scripts/tests','-v'],check=True)
          subprocess.run([sys.executable,'scripts/package.py'],check=True)
          PY
      - name: Store source-bound blobs without changing refs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import hashlib,json,os,sys,urllib.request
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from release_check import source_id
          result={'parent':os.environ['GITHUB_SHA'],'source_id':source_id(),'blobs':{}}
          for name in ('SOURCE_MANIFEST.sha256','scripts/package.py','course/ADVANCED_C1.md','docs/superpowers/plans/2026-11-03-c1-rebuild.md'):
              raw=Path(name).read_bytes()
              expected=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              request=urllib.request.Request('https://api.github.com/repos/clonetimer/RustAppLab/git/blobs',data=json.dumps({'content':raw.decode('utf-8'),'encoding':'utf-8'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json','Accept':'application/vnd.github+json'},method='POST')
              with urllib.request.urlopen(request,timeout=30) as response:sha=json.load(response)['sha']
              assert sha==expected
              result['blobs'][name]=sha
          Path('c1-handoff-objects.json').write_text(json.dumps(result,indent=2),encoding='utf-8')
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c1-handoff-objects
          path: c1-handoff-objects.json
