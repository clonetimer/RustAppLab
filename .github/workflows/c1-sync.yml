name: C1 final manifest objects (feature only)
on:
  push:
    branches: [feat/async-network-c1-rebuild]
permissions:
  contents: read
jobs:
  final-objects:
    if: contains(github.event.head_commit.message, '[c1-final-manifest]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble cleaned candidate without moving any branch
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, sys
          p=Path('scripts/package_learner_kit.py');s=p.read_text(encoding='utf-8')
          old='"BOOK_GUIDE.md", "SQLITE_SETUP.md"';new='"BOOK_GUIDE.md", "ADVANCED_C1.md", "SQLITE_SETUP.md"'
          assert old in s
          p.write_bytes(s.replace(old,new).encode('utf-8'))
          p=Path('scripts/package_c1.py');s=p.read_text(encoding='utf-8')
          old=".write_text(CONFIG,encoding='utf-8')";new=".write_bytes(CONFIG.encode('utf-8'))"
          assert old in s
          p.write_bytes(s.replace(old,new).encode('utf-8'))
          for name in ('.github/workflows/c1-bootstrap.yml','.github/workflows/c1-sync.yml','scripts/c1_sync.py'):
              Path(name).unlink()
          subprocess.run([sys.executable,'-m','unittest','discover','-s','scripts/tests','-v'],check=True)
          subprocess.run([sys.executable,'scripts/package.py'],check=True)
          PY
      - name: Store exact generated blobs only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import hashlib,json,os,sys,urllib.request
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from release_check import source_id
          result={'parent':os.environ['GITHUB_SHA'],'source_id':source_id(),'blobs':{}}
          for name in ('SOURCE_MANIFEST.sha256','scripts/package_learner_kit.py','scripts/package_c1.py'):
              raw=Path(name).read_bytes()
              expected=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              request=urllib.request.Request('https://api.github.com/repos/clonetimer/RustAppLab/git/blobs',data=json.dumps({'content':raw.decode('utf-8'),'encoding':'utf-8'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json','Accept':'application/vnd.github+json'},method='POST')
              with urllib.request.urlopen(request,timeout=30) as response:
                  sha=json.load(response)['sha']
              assert sha==expected
              result['blobs'][name]=sha
          Path('c1-final-objects.json').write_text(json.dumps(result,indent=2),encoding='utf-8')
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c1-final-objects
          path: c1-final-objects.json
