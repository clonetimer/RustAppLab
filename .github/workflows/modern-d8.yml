name: Modern Rust D8 fixed-toolchain experiments
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  d8:
    name: D8 Rust 1.100.0 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy
      - name: Check distribution isolation
        run: python -m unittest discover -s scripts/tests -p test_modern_d8_delivery.py -v
      - name: Execute real compiler, learner red/green, migration and local resolver probes
        run: python scripts/modern_d8_check.py --output d8-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modern-d8-${{ matrix.os }}
          path: d8-evidence/
