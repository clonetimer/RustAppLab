name: Modern Rust D10-B Tokio and Stream
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  d10b:
    name: D10-B Rust 1.100.0 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.100.0
      - name: Validate fixed dependencies and learner distribution
        run: python -m unittest discover -s scripts/tests -p test_modern_d10b_delivery.py -v
      - name: Verify real Tokio tests and relocated frozen learner archive
        run: python scripts/modern_d10b_check.py --output d10b-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modern-d10b-${{ matrix.os }}
          path: d10b-evidence/
