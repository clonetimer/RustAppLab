name: C2 reference quality (feature branch)
on:
  push:
    branches: [feat/c2-axum-servicedesk]
permissions:
  contents: read
jobs:
  reference:
    if: contains(github.event.head_commit.message, '[c2-green]')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
        with:
          components: rustfmt, clippy
      - name: Rust edition/formatting
        run: |
          rustc --version
          cargo fmt --manifest-path projects/advanced-c2/reference/Cargo.toml --all
      - name: C2 clippy strict (including tests)
        run: cargo clippy --locked --manifest-path projects/advanced-c2/reference/Cargo.toml --all-targets -- -D warnings
      - name: Real Axum Debug/Release contracts and docs
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --manifest-path projects/advanced-c2/reference/Cargo.toml --all-targets 2>&1 | tee c2-debug.txt
          cargo test --locked --release --manifest-path projects/advanced-c2/reference/Cargo.toml --all-targets 2>&1 | tee c2-release.txt
          cargo test --locked --manifest-path projects/advanced-c2/reference/Cargo.toml --doc 2>&1 | tee c2-docs.txt
      - name: C2 LabQuest starter and fixed assessment (actual Cargo)
        shell: bash
        run: |
          cargo build --locked --offline -p labquest
          if [[ "$RUNNER_OS" == "Windows" ]]; then EXE=target/debug/labquest.exe; else EXE=target/debug/labquest; fi
          python scripts/c2_e2e.py --exe "$EXE" --output c2-lifecycle.json
      - name: Relocated C2 reference and learner vendor kits
        shell: bash
        run: python scripts/package_c2.py --output c2-portable
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c2-${{ matrix.os }}-evidence
          path: |
            c2-*.txt
            c2-lifecycle.json
            c2-portable/
