name: C2 final standalone workspace format verification
on:
  push:
    branches: [maintenance/c2-review-snapshot]
permissions:
  contents: read
jobs:
  finalize-format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: never
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 07a0463e6323284a39ae863441854718e36220da
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reproduce standalone B3 format failure and correct only layout
        shell: bash
        run: |
          mkdir evidence
          set +e
          cargo fmt --manifest-path projects/advanced-b/reference/Cargo.toml --all -- --check > evidence/format-red.txt 2>&1
          code=$?
          set -e
          test "$code" -eq 1
          grep -q 'taskcli/tests/b3.rs' evidence/format-red.txt
          cargo fmt --manifest-path projects/advanced-b/reference/Cargo.toml --all
          test "$(git diff --name-only)" = "projects/advanced-b/reference/taskcli/tests/b3.rs"
          python - <<'PY'
          import subprocess
          from pathlib import Path
          p='projects/advanced-b/reference/taskcli/tests/b3.rs'
          old=subprocess.check_output(['git','show','HEAD:'+p]).decode()
          new=Path(p).read_text()
          assert ''.join(old.split())==''.join(new.split()), 'Non-whitespace change is forbidden'
          PY
      - name: Validate formatting in every independently checked workspace
        run: |
          cargo fmt --all -- --check
          for m in projects/advanced-b/reference/Cargo.toml projects/advanced-b/reference/json-export/Cargo.toml projects/advanced-c1/reference/Cargo.toml projects/advanced-c2/reference/Cargo.toml projects/advanced-c2/learner/Cargo.toml; do cargo fmt --manifest-path "$m" --all -- --check; done
          python scripts/package.py > evidence/package.txt
          python scripts/structural_check.py > evidence/structure.txt
          python -m unittest discover -s scripts/tests -v > evidence/python.txt 2>&1
      - name: Store exact two-file source correction without modifying refs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add -u
          python - <<'PY'
          import hashlib,json,os,subprocess,sys,urllib.request
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from release_check import source_id
          names=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert set(names)=={'SOURCE_MANIFEST.sha256','projects/advanced-b/reference/taskcli/tests/b3.rs'}, names
          result={'base':'07a0463e6323284a39ae863441854718e36220da','tree':subprocess.check_output(['git','write-tree'],text=True).strip(),'source_id':source_id(),'entries':[]}
          for name in names:
              raw=Path(name).read_bytes()
              expected=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              request=urllib.request.Request('https://api.github.com/repos/clonetimer/RustAppLab/git/blobs',data=json.dumps({'content':raw.decode('utf-8'),'encoding':'utf-8'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(request,timeout=30) as response:sha=json.load(response)['sha']
              assert sha==expected
              result['entries'].append({'path':name,'mode':'100644','type':'blob','sha':sha})
          Path('evidence/c2-format-objects.json').write_text(json.dumps(result,indent=2),encoding='utf-8')
          print(json.dumps(result,indent=2))
          subprocess.run(['git','archive','--format=zip','--output=evidence/c2-final-source.zip',result['tree']],check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c2-final-format
          path: evidence/
