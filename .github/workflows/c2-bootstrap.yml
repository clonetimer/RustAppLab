name: C2 locked bootstrap (feature only)
on:
  push:
    branches: [feat/c2-axum-servicedesk]
permissions:
  contents: read
jobs:
  lock-red:
    if: contains(github.event.head_commit.message, '[c2-bootstrap]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/c2-axum-servicedesk
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt
      - name: Generate real lock graph
        run: cargo generate-lockfile --manifest-path projects/advanced-c2/reference/Cargo.toml
      - name: Observe expected TODO contract failures, not compilation errors
        shell: bash
        run: |
          set +e
          cargo test --locked --manifest-path projects/advanced-c2/reference/Cargo.toml --test contracts > c2-red.txt 2>&1
          code=$?
          set -e
          cat c2-red.txt
          test "$code" -eq 101
          grep -q 'C2 TODO' c2-red.txt
          grep -q 'test result: FAILED' c2-red.txt
      - name: Persist Cargo generated lock only on feature
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/advanced-c2/reference/Cargo.lock
          git commit -m 'build: persist real Cargo1.85 C2 lock'
          git push origin HEAD:refs/heads/feat/c2-axum-servicedesk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c2-red-contract
          path: |
            c2-red.txt
            projects/advanced-c2/reference/Cargo.lock
