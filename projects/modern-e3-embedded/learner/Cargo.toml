[package]
name = "e3-embedded-lab"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false
license = "MIT"

[workspace]
resolver = "3"

[dependencies]
embedded-hal = "=1.0.0"

[target.'cfg(all(target_arch = "arm", target_os = "none"))'.dependencies]
cortex-m = "=0.7.7"
cortex-m-rt = "=0.7.5"
cortex-m-semihosting = "=0.5.0"

[features]
firmware = []

[[bin]]
name = "firmware"
path = "src/bin/firmware.rs"
required-features = ["firmware"]
test = false
bench = false

[profile.release]
panic = "abort"
