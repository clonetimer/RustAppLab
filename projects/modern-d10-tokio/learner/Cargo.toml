[package]
name = "d10-tokio-lab"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false
license = "MIT"

[workspace]
resolver = "3"

[dependencies]
# Same versions and Tokio feature graph as C1; test-util adds virtual-time tests.
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal", "test-util"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
