[package]
name = "taskpocket-json"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"

[workspace]
resolver = "2"

[lib]
name = "taskpocket_json"

[[bin]]
name = "taskpocket-json"
path = "src/main.rs"

[features]
default = []
strict-titles = ["taskcore/strict-titles"]

[dependencies]
taskcore = { path = "../taskcore" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
