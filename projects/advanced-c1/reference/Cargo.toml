[package]
name = "netfetch-c1"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace]
resolver = "2"

[dependencies]
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal"] }
reqwest = { version = "=0.12.24", default-features = false }
