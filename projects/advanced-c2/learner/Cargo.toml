[package]
name = "servicedesk-c2"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace]
resolver = "2"

[dependencies]
axum = { version = "=0.8.8", default-features = false, features = ["http1", "tokio", "json"] }
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "macros", "sync", "net", "signal", "time"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
servicedesk = { path = "../../../apps/servicedesk" }

[dev-dependencies]
reqwest = { version = "=0.12.24", default-features = false, features = ["json"] }
tower = { version = "=0.5.2", features = ["util"] }
