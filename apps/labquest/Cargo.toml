[package]
name = "labquest"
version = "0.19.0-rc.1"
edition = "2021"
rust-version = "1.74"
license = "MIT"
description = "Case-based, self-checking learning console that connects four Rust AppLab products"

[features]
b4-integration = []

[[test]]
name = "advanced_b_json_e2e"
path = "tests/advanced_b_json_e2e.rs"
required-features = ["b4-integration"]

[dependencies]
filequest = { path = "../filequest" }
loglens = { path = "../loglens" }
safesync = { path = "../safesync" }
