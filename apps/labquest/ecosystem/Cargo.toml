[package]
name = "rustapplab-network-probe"
version = "0.1.0"
edition = "2021"
# Candidate baseline, not a verified minimum for the full dependency graph.
rust-version = "1.85"
license = "MIT"

[workspace]

[dependencies]
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }
axum = { version = "=0.8.6", default-features = false, features = ["http1", "json", "tokio"] }
reqwest = { version = "=0.12.24", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
