<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ServiceDesk · 我的工单台</title>
<style>:root{font-family:system-ui,'Segoe UI',sans-serif;color:#1f2937;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}main{max-width:860px;margin:0 auto;padding:34px 20px}h1{font-size:34px;margin:5px 0}p{color:#526072;line-height:1.6}form{display:flex;gap:10px;background:white;padding:18px;border:1px solid #dfe4ee;border-radius:16px;margin:24px 0}input{flex:1;min-width:0;border:1px solid #c8ced9;padding:12px;border-radius:8px;font:inherit}button{background:#1f4dd5;color:white;border:none;border-radius:8px;padding:11px 18px;font-weight:600;cursor:pointer}button:disabled{opacity:.5}ul{list-style:none;padding:0}li{display:flex;align-items:center;justify-content:space-between;gap:16px;background:white;border:1px solid #dfe4ee;border-radius:12px;padding:14px 18px;margin-bottom:10px;overflow-wrap:anywhere}.closed{opacity:.6}#status{min-height:24px;color:#34498a}@media(max-width:560px){h1{font-size:28px}form{flex-direction:column}li{align-items:flex-start;flex-direction:column}}
</style></head><body><main><header><small>RUST APPLAB / NETWORK FOUNDATIONS</small><h1>ServiceDesk · 我的工单台</h1><p>在自己的电脑上创建、查看和关闭工作任务。每次操作会写入本地日志。这个教学服务器仅监听 127.0.0.1，同步串行，不是公网部署框架。</p></header><form id="new"><input id="title" maxlength="120" required placeholder="例如：给 NetFetch 添加下载校验" aria-label="工单标题"><button>新建工单</button></form><div id="status" role="status" aria-live="polite"></div><h2>工单列表 <span id="count"></span></h2><ul id="tickets"></ul></main><script>
const $=id=>document.getElementById(id);const status=$('status');
async function call(path,body){const opt=body===undefined?{}:{method:'POST',headers:{'X-RustAppLab-Client':'1','Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(body)};const r=await fetch(path,opt);if(!r.ok)throw new Error(await r.text());return r.json()}
async function refresh(){const data=await call('/api/tickets');$('count').textContent='('+data.count+')';const list=$('tickets');list.replaceChildren();for(const t of data.tickets){const row=document.createElement('li');if(t.done)row.className='closed';const label=document.createElement('span');label.textContent=`#${t.id} · ${t.title} ${t.done?'（已关闭）':''}`;row.append(label);if(!t.done){const btn=document.createElement('button');btn.textContent='关闭';btn.addEventListener('click',async()=>{try{await call('/api/close',{id:String(t.id)});status.textContent='已关闭工单 #'+t.id;await refresh()}catch(e){status.textContent='操作失败：'+e.message}});row.append(btn)}list.append(row)}}
$('new').addEventListener('submit',async e=>{e.preventDefault();try{await call('/api/tickets',{title:$('title').value});$('title').value='';status.textContent='工单已保存';await refresh()}catch(err){status.textContent='保存失败：'+err.message}});
refresh().catch(err=>{status.textContent='读取失败：'+err.message});
</script></body></html>
